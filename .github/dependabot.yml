# Dependabot version updates for control-menu.
#
# Security updates are handled separately by Dependabot security alerts (enabled
# via repo Settings → Code security and analysis). This file covers routine
# non-security version bumps.
#
# Two ecosystems wired:
#   - nuget: covers the .NET 10 dep graph (EF Core, SkiaSharp, Velopack, bunit,
#     xUnit, Microsoft.* test packages, etc.) across ControlMenu.csproj,
#     ControlMenu.Common.csproj, ControlMenuLauncher.csproj, ControlMenuTray.csproj,
#     ControlMenu.Tests.csproj, ControlMenu.Common.Tests.csproj, and
#     ControlMenuLauncher.Tests.csproj. Dependabot auto-discovers all csproj files
#     under the root.
#   - github-actions: maintains the SHA-pinned action refs in
#     .github/workflows/release.yml. Upstream actions tag new versions
#     periodically; without this Dependabot would never bump our pins and we'd
#     drift on security fixes shipped in the actions themselves.
#
# Weekly cadence keeps PR noise manageable for a solo-owned repo.

version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
